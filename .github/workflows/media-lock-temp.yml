name: Generate media lockfile (temporary)
on: [push]
jobs:
  lockfile:
    if: github.ref == 'refs/heads/feature/product-media-studio-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve new S3 dependency
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          echo LOCKFILE_BEGIN
          base64 -w0 pnpm-lock.yaml
          echo
          echo LOCKFILE_END
