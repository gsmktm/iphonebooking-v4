name: Media integration test formatter (temporary)
on: [push]
jobs:
  format:
    if: github.ref == 'refs/heads/feature/product-media-studio-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact formatted media integration test
        run: |
          pnpm exec prettier --write tests/integration/media-studio.test.ts
          echo FORMATTED_BEGIN:tests/integration/media-studio.test.ts
          base64 -w0 tests/integration/media-studio.test.ts
          echo
          echo FORMATTED_END:tests/integration/media-studio.test.ts
