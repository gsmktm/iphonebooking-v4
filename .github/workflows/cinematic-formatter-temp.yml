name: Format cinematic category assets (temporary)
on: [push]
jobs:
  prettier-preview:
    if: github.ref == 'refs/heads/design/cinematic-real-photo-category-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print precisely formatted source
        run: |
          pnpm exec prettier --write apps/web/src/features/category/CategoryCinematicHero.tsx apps/web/src/features/category/cinematic-category.css apps/web/src/features/category/CategoryPage.tsx apps/web/src/features/home/HomeDeviceFrames.tsx tests/e2e/cinematic-category-heroes.spec.ts
          for file in apps/web/src/features/category/CategoryCinematicHero.tsx apps/web/src/features/category/cinematic-category.css apps/web/src/features/category/CategoryPage.tsx apps/web/src/features/home/HomeDeviceFrames.tsx tests/e2e/cinematic-category-heroes.spec.ts; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
