name: Format MacBook specification UI (temporary)
on: [push]
jobs:
  format:
    if: github.ref == 'refs/heads/catalog/macbook-supplied-prices-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier output for Commerce
        run: |
          pnpm exec prettier --write apps/web/src/pages/Commerce.tsx
          echo FORMATTED_BEGIN:apps/web/src/pages/Commerce.tsx
          base64 -w0 apps/web/src/pages/Commerce.tsx
          echo
          echo FORMATTED_END:apps/web/src/pages/Commerce.tsx
