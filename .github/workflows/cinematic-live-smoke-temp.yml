name: Live cinematic category browser smoke (temporary)
on: [push]
jobs:
  live-category-smoke:
    if: github.ref == 'refs/heads/design/cinematic-real-photo-category-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test deployed hero route bodies and browser exceptions
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless:true});
          const base='https://iphonebooking-web-api-production.up.railway.app';
          const routes=['iphone','mac','ipad','watch','airpods','accessories'];
          let failure=false;
          for(const route of routes){
            const page=await browser.newPage();
            const errors=[];
            const badResponses=[];
            page.on('pageerror',e=>errors.push(e.stack||String(e)));
            page.on('response',r=>{if(r.status()>=400&&r.url().includes('/api/v1/'))badResponses.push({status:r.status(),url:r.url()})});
            let status=null;let visible=false;let heading='';let screenshotTitle='';
            try {
              const response=await page.goto(base+'/'+route,{waitUntil:'domcontentloaded',timeout:30000});
              status=response?.status()??null;
              await page.locator('.cinematic-category').waitFor({state:'visible',timeout:20000});
              visible=true;
              heading=await page.locator('.cinematic-category h1').innerText();
              screenshotTitle=await page.locator('.cinematic-category-eyebrow').innerText();
            }catch(e){
              errors.push(String(e.stack||e));
              heading=(await page.locator('body').innerText().catch(()=>'')).slice(0,320);
            }
            const broken=status!==200||!visible||errors.length>0;
            if(broken) failure=true;
            console.log('LIVE_FRAME_CHECK:'+JSON.stringify({route,status,visible,heading,screenshotTitle,errors,badResponses,broken}));
            await page.close();
          }
          await browser.close();
          if(failure)process.exitCode=1;
          NODE
