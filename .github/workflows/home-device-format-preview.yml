name: Format home device frame files (temporary)
on: [push]
jobs:
  format-device-frames:
    if: github.ref == 'refs/heads/design/home-device-frames-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted files
        run: |
          pnpm exec prettier --write apps/web/src/features/home/HomeDeviceFrames.tsx apps/web/src/features/home/device-frames.css tests/e2e/home-device-frames.spec.ts
          for file in apps/web/src/features/home/HomeDeviceFrames.tsx apps/web/src/features/home/device-frames.css tests/e2e/home-device-frames.spec.ts; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
