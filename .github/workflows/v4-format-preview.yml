name: V4 formatter preview (temporary)
on: [push]
jobs:
  format-preview:
    if: github.ref == 'refs/heads/design/all-pages-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted public source for review
        run: |
          pnpm exec prettier --write docs/v4-page-inventory.md tests/e2e/v4-pages.spec.ts apps/web/src/components/RouteWayfinding.tsx apps/web/src/styles/v4-pages.css
          for file in docs/v4-page-inventory.md tests/e2e/v4-pages.spec.ts apps/web/src/components/RouteWayfinding.tsx apps/web/src/styles/v4-pages.css; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
