name: Format Apple sourced catalog files (temporary)
on: [push]
jobs:
  formatter:
    if: github.ref == 'refs/heads/feature/apple-verified-reference-catalog-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted Apple reference files
        run: |
          pnpm exec prettier --write apps/web/src/features/apple/OfficialAppleModels.tsx apps/web/src/features/apple/official-apple.css apps/web/src/features/category/CategoryPage.tsx apps/web/src/pages/Home.tsx apps/web/src/pages/Catalog.tsx apps/web/src/features/category/config.ts apps/api/server/routes/catalog.ts tests/e2e/official-apple-reference.spec.ts docs/apple-verified-reference-catalog.md
          for file in apps/web/src/features/apple/OfficialAppleModels.tsx apps/web/src/features/apple/official-apple.css apps/web/src/features/category/CategoryPage.tsx apps/web/src/pages/Home.tsx apps/web/src/pages/Catalog.tsx apps/web/src/features/category/config.ts apps/api/server/routes/catalog.ts tests/e2e/official-apple-reference.spec.ts docs/apple-verified-reference-catalog.md; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
